version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sismowatch_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sismowatch_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SismoWatchSecretPassword2026!}
      POSTGRES_DB: ${POSTGRES_DB:-sismowatch_db}
    ports:
      - "5432:5432"
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sismowatch_admin} -d ${POSTGRES_DB:-sismowatch_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sismowatch_net

  airflow-init:
    image: apache/airflow:2.8.2-python3.11
    container_name: sismowatch_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-sismowatch_admin}:${POSTGRES_PASSWORD:-SismoWatchSecretPassword2026!}@postgres:5432/${POSTGRES_DB:-sismowatch_db}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFfDewgnbL3hnhANo=}
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    command: >
      bash -c "airflow db migrate &&
               airflow users create --username ${AIRFLOW_ADMIN_USER:-admin} --firstname Sismo --lastname Watch --role Admin --email admin@sismowatch.org --password ${AIRFLOW_ADMIN_PASSWORD:-admin} || true"
    networks:
      - sismowatch_net

  airflow-webserver:
    image: apache/airflow:2.8.2-python3.11
    container_name: sismowatch_airflow_webserver
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-sismowatch_admin}:${POSTGRES_PASSWORD:-SismoWatchSecretPassword2026!}@postgres:5432/${POSTGRES_DB:-sismowatch_db}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-sismowatch_airflow_super_secret_key_12345}
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./spark:/opt/airflow/spark
      - ./quality:/opt/airflow/quality
    networks:
      - sismowatch_net

  airflow-scheduler:
    image: apache/airflow:2.8.2-python3.11
    container_name: sismowatch_airflow_scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-sismowatch_admin}:${POSTGRES_PASSWORD:-SismoWatchSecretPassword2026!}@postgres:5432/${POSTGRES_DB:-sismowatch_db}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./spark:/opt/airflow/spark
      - ./quality:/opt/airflow/quality
    networks:
      - sismowatch_net

  webapp-api:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    container_name: sismowatch_webapp_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sismowatch_db}
      DB_READER_USER: ${DB_READER_USER:-app_curated_reader}
      DB_READER_PASSWORD: ${DB_READER_PASSWORD:-CuratedReaderPass123!}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_sismowatch_prod_sec_2026}
      API_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./webapp/backend:/app/backend
      - ./webapp/frontend:/app/frontend
      - ./agent:/app/agent
      - ./quality:/app/quality
    networks:
      - sismowatch_net

volumes:
  postgres_data:
    driver: local

networks:
  sismowatch_net:
    driver: bridge
